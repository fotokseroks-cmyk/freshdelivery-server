<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админка — Посетители</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }

    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.1);
      padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    }
    header h1 { margin: 0; font-size: 18px; }
    #count {
      background: #e53935; color: #fff; border-radius: 999px;
      padding: 2px 10px; font-size: 14px;
    }

    #map {
      position: absolute; top: 56px; left: 0; right: 0; bottom: 0;
      background: #e8e6e1;
    }

    /* Красная пульсирующая точка */
    .dot {
      position: absolute; top: 50%; left: 50%;
      width: 12px; height: 12px;
      transform: translate(-50%, -50%);
      background: #ff2d2d; border: 2px solid #fff; border-radius: 50%;
      box-shadow: 0 0 6px rgba(255,45,45,.8);
    }
    .ring {
      position: absolute; top: 50%; left: 50%;
      width: 12px; height: 12px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255,45,45,.9); border-radius: 50%;
      animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse {
      from { width: 12px; height: 12px; opacity: .9; }
      to   { width: 70px; height: 70px; opacity: 0; }
    }

    /* Панель со списком */
    #panel {
      position: fixed; z-index: 1000; right: 12px; top: 68px; bottom: 12px;
      width: 330px; max-width: calc(100% - 24px);
      background: #fff; border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,.15);
      display: flex; flex-direction: column; overflow: hidden;
    }
    #list { overflow-y: auto; padding: 10px; flex: 1; }
    .stats {
      padding: 8px 10px; font-size: 12px; color: #555;
      border-bottom: 1px solid #eee; margin-bottom: 8px; line-height: 1.6;
    }
    .card {
      border: 1px solid #eee; border-radius: 10px;
      padding: 10px 12px; margin-bottom: 10px;
      font-size: 13px; line-height: 1.55;
      cursor: pointer;
    }
    .card:hover { border-color: #ff8a80; }
    .card b { font-size: 14px; }
    .online  { color: #2e7d32; font-weight: 600; }
    .offline { color: #9e9e9e; font-weight: 600; }
    .vpn {
      display: inline-block; margin-top: 4px;
      background: #fff3e0; color: #e65100; border: 1px solid #ffb74d;
      border-radius: 6px; padding: 1px 8px; font-size: 11px;
    }
    .fp { color: #999; font-size: 11px; word-break: break-all; }

    #empty {
      padding: 30px 10px; text-align: center;
      color: #888; font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>👥 Посетители <span id="count">0</span></h1>
  </header>

  <div id="map"></div>

  <div id="panel">
    <div id="list">
      <div id="empty">Пока никого нет...</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // === АДРЕС СЕРВЕРА: впишите сюда адрес с Render после деплоя ===
    var SERVER = 'https://ПОМЕНЯЙТЕ-НА-АДРЕС-СЕРВЕРА.onrender.com';
    var ADMIN_KEY = 'fresh2026';  // смените на свой пароль — как в server.js
    // ---------- Карта ----------
    const map = L.map('map', {
      center: [48.7, 44.5],   // старт: Волгоград, потом подстроится под гостей
      zoom: 10,
      maxBounds: L.latLngBounds([-85, -180], [85, 180]),
      maxBoundsViscosity: 1
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Минимальный зум: карта всегда полностью закрывает экран — серого фона нет
    function minZoomFor() {
      return Math.max(
        Math.ceil(Math.log2(window.innerWidth  / 256)),
        Math.ceil(Math.log2(window.innerHeight / 256)),
        2
      );
    }
    map.setMinZoom(minZoomFor());
    window.addEventListener('resize', function () { map.setMinZoom(minZoomFor()); });

    // ---------- Иконки источников ----------
    const sourceIcons = {
      'Telegram': '✈️', 'WhatsApp': '💬', 'Instagram': '📸',
      'VK': '🅥', 'Яндекс': '🟥', 'Google': '🔎',
      'Facebook': '📘', 'Mail.ru': '✉️', 'Одноклассники': '🎧',
      'Avito': '🛒', '2ГИС': '🗺', 'Прямой переход': '🔗'
    };
    function sourceLabel(src) {
      const base = (src || 'Прямой переход').replace(' (встроенный браузер)', '');
      return (sourceIcons[base] || '🌐') + ' ' + (src || 'Прямой переход');
    }

    // ---------- Элементы ----------
    const markers = new Map();
    const listEl  = document.getElementById('list');
    const emptyEl = document.getElementById('empty');
    const countEl = document.getElementById('count');
    let fitted = false;

    function pulseIcon() {
      return L.divIcon({
        className: '',
        html: '<div class="ring"></div><div class="dot"></div>',
        iconSize: [0, 0],
        iconAnchor: [0, 0]
      });
    }

    function fmtTime(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    // Строка об устройстве
    function deviceLine(v) {
      const d = v.deviceInfo;
      if (!d) return v.device || 'Гость';
      let s = '📱 ' + (d.model || 'Устройство') + ' · ' + (d.os || '?') + ' · ' + (d.browser || '?');
      return s;
    }

    function screenLine(v) {
      const d = v.deviceInfo;
      if (!d) return '';
      return 'Экран: ' + d.screen + ' @' + d.dpr + 'x · ' + (d.orientation || '');
    }

    function geoLine(v) {
      if (v.country) {
        return (v.flag || '🌍') + ' ' + v.country +
          (v.city ? ' · ' + v.city : '') +
          (v.region && v.region !== v.city ? ', ' + v.region : '');
      }
      return '🌍 Местоположение по IP пока не определено';
    }

    function ipLine(v) {
      if (!v.ip) return '';
      let s = '🔗 IP: ' + v.ip;
      if (v.isp) s += ' · ' + v.isp;
      return s;
    }

    // Карточка гостя
    function card(v) {
      let html = '<div class="card" data-lat="' + v.lat + '" data-lng="' + v.lng + '">' +
        '<b>' + deviceLine(v) + '</b> · ' +
        '<span class="' + (v.online ? 'online' : 'offline') + '">' + (v.online ? 'онлайн' : 'офлайн') + '</span><br>' +
        'Источник: ' + sourceLabel(v.source) + '<br>' +
        'Страница: ' + (v.landing || '/') + '<br>' +
        geoLine(v) + '<br>';
      const ip = ipLine(v);
      if (ip) html += ip + '<br>';
      const scr = screenLine(v);
      if (scr) html += scr + '<br>';
      if (v.vpnSuspect) html += '<span class="vpn">🛡 Похоже на VPN/прокси</span><br>';
      html += 'Пришёл: ' + fmtTime(v.joinedAt) + ' · Был: ' + fmtTime(v.lastSeen) + '<br>' +
        'Координаты: ' + (v.lat != null ? v.lat.toFixed(5) + ', ' + v.lng.toFixed(5) : 'нет') + '<br>' +
        '<span class="fp">Отпечаток: ' + ((v.fp || '—') + '').slice(0, 26) + '</span>' +
        '</div>';
      return html;
    }

    // Сводка по источникам
    function summarize(list) {
      const m = new Map();
      for (const v of list) {
        const key = v.source || 'Прямой переход';
        m.set(key, (m.get(key) || 0) + 1);
      }
      return Array.from(m.entries()).sort(function (a, b) { return b[1] - a[1]; });
    }

    // Клик по карточке — перелетаем к гостю на карте
    listEl.addEventListener('click', function (e) {
      const cardEl = e.target.closest('.card');
      if (!cardEl) return;
      const lat = parseFloat(cardEl.dataset.lat);
      const lng = parseFloat(cardEl.dataset.lng);
      if (!isNaN(lat) && !isNaN(lng)) {
        map.flyTo([lat, lng], Math.max(map.getZoom(), 15), { duration: 0.8 });
      }
    });

    // ---------- Обновление данных ----------
    async function refresh() {
      try {
        const res  = await fetch(SERVER + '/api/visitors?key=' + encodeURIComponent(ADMIN_KEY));
        const list = await res.json();
        const seen = new Set();

        // Маркеры на карте — только онлайн-гости с координатами
        for (const v of list) {
          if (v.lat == null || !v.online) continue;
          seen.add(v.id);
          const pos = [v.lat, v.lng];
          let mk = markers.get(v.id);
          if (!mk) {
            mk = L.marker(pos, { icon: pulseIcon() })
                  .addTo(map)
                  .bindTooltip(v.device || 'Гость', { direction: 'top' });
            markers.set(v.id, mk);
          } else {
            mk.setLatLng(pos);
          }
        }
        // Ушедших или офлайн — убираем с карты
        for (const [id, mk] of markers) {
          if (!seen.has(id)) { map.removeLayer(mk); markers.delete(id); }
        }

        // Счётчик и список
        countEl.textContent = list.length;

        if (list.length === 0) {
          if (!emptyEl.parentNode) listEl.appendChild(emptyEl);
          emptyEl.style.display = 'block';
          emptyEl.textContent = 'Пока никого нет...';
        } else {
          if (emptyEl.parentNode) emptyEl.remove();
          const stats = summarize(list);
          listEl.innerHTML =
            '<div class="stats">' +
            stats.map(function (p) { return sourceLabel(p[0]) + ' — ' + p[1]; }).join(' · ') +
            '</div>' +
            list.map(card).join('');
        }

        // Первый раз — подогнать карту под всех гостей
        if (!fitted && markers.size) {
          map.fitBounds(L.featureGroup(Array.from(markers.values())).getBounds().pad(0.3));
          fitted = true;
        }
      } catch (e) { /* сервер недоступен — попробуем в следующий раз */ }
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
